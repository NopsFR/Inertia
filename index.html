  <style>

    .btn-primary{background:white;color:#0a0a0a;border-bottom:4px solid rgba(180,180,180,1);box-shadow:0 4px 0 rgba(180,180,180,1),0 0 30px rgba(255,255,255,.5);border-radius:999px;font-weight:700;transition:.25s}
    .btn-primary:hover{transform:translateY(2px);box-shadow:0 2px 0 rgba(180,180,180,1),0 0 40px rgba(255,255,255,.7)}

    .btn-glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);border-radius:999px;font-weight:700;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);transition:.25s;color:#fff}
    .btn-glass:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
    .field{width:100%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);border-radius:.75rem;padding:.8rem 1rem;outline:none;transition:.2s;color:#fff}
    .field:focus{border-color:rgba(34,211,238,.7);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
    .terminal{font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:1.7;color:#22d3ee;background:rgba(0,0,0,.75);border:1px solid rgba(34,211,238,.25);border-radius:1rem;padding:1rem 1.25rem;box-shadow:inset 0 0 30px rgba(34,211,238,.04),0 8px 32px rgba(0,0,0,.5)}
    .terminal .line{opacity:0;animation:fadeInLine .15s ease forwards}
    .terminal .cursor{display:inline-block;width:8px;height:14px;background:#22d3ee;margin-left:2px}
    @keyframes fadeInLine{from{opacity:0}to{opacity:1}}
    #snow-field{position:fixed;inset:0;z-index:10;pointer-events:none}
    .ambient{background:radial-gradient(ellipse 80% 50% at 50% 35%,rgba(14,116,144,.15),transparent 60%),radial-gradient(ellipse 28% 22% at 53% 60%,rgba(34,211,238,.06),transparent 78%),#000}
    .nav-link{color:rgba(255,255,255,.52);transition:.2s;font-weight:600;letter-spacing:.04em}.nav-link:hover,.nav-link.active{color:#fff}.nav-link.active{color:#00f0ff}
    .page{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.75,.2,1),transform .7s cubic-bezier(.2,.75,.2,1)}.reveal.is-visible{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}#snow-field{display:none}}
  </style>
</head>
<body class="ambient font-jura antialiased">

  <div class="fixed inset-0 -z-10 opacity-[.06] mix-blend-screen" style="background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 60% 50% at 50% 40%,black 40%,transparent 75%)"></div>

  <script>
  let products=[{id:1,name:'Roblox Executors',game:'ROBLOX',price:2.99,currency:'USD',stock:'IN STOCK',rating:5,reviews:214,description:'Premium Roblox executors — undetected, powerful, and easy to use. Pick your executor.',image:''},{id:2,name:'Roblox Scripts',game:'ROBLOX',price:4.99,currency:'USD',stock:'IN STOCK',rating:5,reviews:300,description:'Premium scripts for the most popular Roblox games. Pick your game to see which scripts support it.',image:''},{id:3,name:'Fallen Survival Account',game:'ROBLOX',price:1.99,currency:'USD',stock:'OUT OF STOCK',rating:5,reviews:156,description:'Roblox accounts with access to the game Fallen Survival. Unverified, aged, multiple variants available.',image:''},{id:4,name:'Matcha External',game:'ROBLOX',price:11.97,currency:'USD',stock:'IN STOCK',rating:5,reviews:58,description:'Premium Roblox external. Silent aim, full ESP, triggerbot and advanced visuals. Lifetime access.',image:''},{id:5,name:'Ignite Script',game:'ROBLOX',price:4.99,currency:'USD',stock:'IN STOCK',rating:4.9,reviews:321,description:'The ultimate undetected script for Fallen Survival and Havoc. Silent Aim • Wallbang • Hitscan • ESP and much more.',image:''},{id:6,name:'Serversiding',game:'ROBLOX',price:15,currency:'EUR',stock:'IN STOCK',rating:5,reviews:132,description:'The best web-based Roblox serverside executor. 600+ scripts straight from your browser, no download needed.',image:''},{id:7,name:'Xtools Roblox Multi Tool',game:'ROBLOX',price:19.99,currency:'USD',stock:'IN STOCK',rating:4.9,reviews:189,description:'30+ specialized tools to automate Roblox functions. No recurring fees.',image:''},{id:8,name:'Neverlose CS2',game:'CS2',price:31,currency:'EUR',stock:'IN STOCK',rating:5,reviews:48,description:'Premium CS2 internal cheat from Neverlose. Instant key delivery, redeem with your Neverlose username.',image:''}]; let site={hero:{title:'Move faster.',highlight:'Play smarter.',description:'Inertia is a refined marketplace for the tools and access you need—delivered through a focused, modern experience.',image:''}}; let adminState=null; let ownerState=null;
  let cart=JSON.parse(localStorage.getItem('inertia-cart')||'[]'); let catalogFilter='All'; let catalogQuery=''; let catalogSort='featured';
  let oauthConfig={googleClientId:'',discordClientId:''};
  const money=x=>(x.currency==='EUR'?'€':'$')+Number(x.price).toFixed(2); const save=()=>localStorage.setItem('inertia-cart',JSON.stringify(cart)); const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&','<':'<','>':'>',"'":'&#39;','"':'"'}[c]));
  function go(path){history.pushState({},'',path);render();enhance();window.scrollTo({top:0,behavior:'smooth'})} window.onpopstate=()=>{render();enhance()};
  function nav(){let p=location.pathname;return `<nav class="fixed top-0 left-0 right-0 z-50 px-4 py-4 md:px-8 bg-black/50 backdrop-blur-md"><div class="max-w-7xl mx-auto flex justify-between items-center"><a href="/" data-nav class="text-xl font-black tracking-tight text-white">inertia<span class="text-inertia">.</span></a><div class="hidden md:flex items-center gap-4">${[['/','Home'],['/products','Products'],['/funpay','Funpay'],['/discord','Discord'],['/cart','Cart'],['/login','Log in']].map(([u,n])=>`<a data-nav href="${u}" class="nav-link ${p===u?'active':''}">${n}</a>`).join('')}</div><div class="flex items-center gap-2"><a data-nav href="/cart" class="btn-glass relative rounded-xl px-3 py-2 text-sm font-semibold">Cart <span class="ml-1 rounded-md bg-white/10 px-1.5 py-0.5 text-[10px] text-inertia">${cart.length}</span></a></div></div></nav>`}
  function footer(){return `<footer class="mt-24 border-t border-white/10 px-5 py-10 text-center text-xs text-white/35"><p class="font-bold tracking-wide text-white/60">inertia<span class="text-inertia">.</span></p><p class="mt-3">© 2026 Inertia. Built for a smoother marketplace experience.</p><div class="mt-4 flex justify-center gap-4 font-semibold"><a data-nav href="/discord" class="hover:text-inertia">Discord</a><a data-nav href="/funpay" class="hover:text-inertia">Platform</a></div></footer>`}
  function productCard(x){return `<article class="glow-card glass relative overflow-hidden rounded-2xl p-5"><div class="relative"><div class="flex items-center justify-between"><span class="rounded-full border border-white/10 bg-black/20 px-2.5 py-1 text-[10px] font-bold text-white/75">${esc(x.game)}</span><span class="text-[10px] font-semibold ${x.stock==='OUT OF STOCK'?'text-red-300':'text-inertia'}">${esc(x.stock)}</span></div><div class="mt-10"><p class="text-[11px] font-semibold uppercase tracking-[.15em] text-white/40">★ ${esc(x.rating)} <span class="ml-1 text-white/35">(${esc(x.reviews)})</span></p><h3 class="mt-1 text-lg font-bold">${esc(x.name)}</h3><p class="mt-3 min-h-[40px] text-xs leading-5 text-white/55">${esc(x.description)}</p></div><div class="mt-5 flex items-end justify-between border-t border-white/10 pt-4"><div><span class="block text-[10px] font-medium uppercase tracking-wider text-white/35">Starting from</span><b class="text-xl">${money(x)}</b></div><button ${x.stock==='OUT OF STOCK'?'disabled':''} onclick="add(${x.id})" class="btn-primary rounded-xl px-3.5 py-2 text-xs font-bold text-black disabled:cursor-not-allowed disabled:opacity-35">${x.stock==='OUT OF STOCK'?'Unavailable':'Add to cart'}</button></div></div></article>`}
  function shell(content){return nav()+`<main class="mx-auto max-w-7xl px-5 pt-24">${content}</main>`+footer()}
  function home(){return shell(`<section class="page grid min-h-[580px] items-center gap-10 py-16 lg:grid-cols-[1.12fr_.88fr]"><div><div class="mb-5 inline-flex items-center gap-2 rounded-full border border-cyan-300/15 bg-cyan-300/[.06] px-3 py-1.5 text-[11px] font-semibold text-inertia"><span class="h-1.5 w-1.5 animate-pulse rounded-full bg-inertia"></span> Game marketplace</div><h1 class="max-w-3xl text-5xl font-black tracking-[-.06em] text-white sm:text-7xl lg:text-8xl" style="text-shadow:0 0 24px rgba(255,255,255,.55),0 0 60px rgba(255,255,255,.18)">Move faster.<br><span class="bg-gradient-to-r from-cyan-400 via-cyan-200 to-inertia bg-clip-text text-transparent">Play smarter.</span></h1><p class="mt-6 max-w-xl text-base leading-7 text-white/55">Inertia is a refined marketplace for the tools and access you need—delivered through a focused, modern experience.</p><div class="mt-8 flex flex-wrap gap-3"><a data-nav href="/products" class="btn-primary rounded-xl px-5 py-3 text-sm font-bold">Explore products</a><a data-nav href="/discord" class="btn-glass rounded-xl px-5 py-3 text-sm font-bold">Join community</a></div><div class="mt-11 grid max-w-xl grid-cols-3 gap-6 border-t border-white/10 pt-6"><div><b class="text-2xl text-white/90">5K+</b><span class="mt-1 block text-[10px] uppercase tracking-wider text-white/40">Orders</span></div><div><b class="text-2xl text-white/90">4.9/5</b><span class="mt-1 block text-[10px] uppercase tracking-wider text-white/40">Rating</span></div><div><b class="text-2xl text-white/90">24/7</b><span class="mt-1 block text-[10px] uppercase tracking-wider text-white/40">Support</span></div></div></div><div class="glass glow-card relative overflow-hidden rounded-3xl p-5"><div class="flex items-center gap-1.5 mb-3"><span class="w-2.5 h-2.5 rounded-full bg-white/15"></span><span class="w-2.5 h-2.5 rounded-full bg-white/15"></span><span class="w-2.5 h-2.5 rounded-full bg-white/15"></span><span class="ml-2 text-[10px] uppercase tracking-[.25em] text-white/40">Inertia Loader · Live</span><span class="ml-auto flex items-center gap-1.5 text-[10px] uppercase tracking-[.25em] text-inertia/80"><span class="relative inline-block h-1.5 w-1.5 rounded-full bg-inertia"></span> Recording</span></div><div class="terminal" id="console-terminal"><div class="line" style="animation-delay:.2s">><span class="text-white/80"> Authenticated Successfully...</span></div><div class="line" style="animation-delay:.5s">><span class="text-white/80"> Fetching Modules...</span></div><div class="line" style="animation-delay:.8s">><span class="text-white/80"> Setting Hooks...</span></div><div class="line" style="animation-delay:1.1s">><span class="text-white/80"> Calling Module Init....</span></div><div class="line" style="animation-delay:1.4s">><span class="text-white/80"> Module Initalized</span></div><div class="line" style="animation-delay:1.7s">><span class="text-white/80"> Calling Render...</span></div><div class="line" style="animation-delay:2.0s">><span class="text-white/80"> Render Initialized...</span></div><div class="line" style="animation-delay:2.3s">><span class="text-white/80"> Cleaning up...</span></div><div class="line" style="animation-delay:2.6s">><span class="text-white/80"> Successfully Injected..</span><span class="cursor"></span></div></div><div class="mt-3 grid grid-cols-2 gap-3"><div class="rounded-2xl border border-white/10 bg-black/20 p-4"><p class="text-[10px] uppercase tracking-wider text-white/40">Current status</p><p class="mt-2 font-semibold text-inertia">Systems online</p></div><div class="rounded-2xl border border-white/10 bg-black/20 p-4"><p class="text-[10px] uppercase tracking-wider text-white/40">Delivery</p><p class="mt-2 font-semibold">Instant</p></div></div></div></section><section class="page py-16"><div class="mb-8 flex items-end justify-between"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Curated for you</p><h2 class="mt-2 text-3xl font-black tracking-tight text-white">Featured products</h2></div><a data-nav href="/products" class="text-sm font-semibold text-inertia hover:text-white">View catalog →</a></div><div class="grid gap-4 md:grid-cols-3">${products.slice(0,3).map(productCard).join('')}</div></section><section class="page py-16"><p class="text-center text-xs font-bold uppercase tracking-[.18em] text-inertia">Browse by game</p><div class="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">${['Warzone','CS2','Roblox','Rust'].map((g,i)=>`<button onclick="filterGo('${g}')" class="glow-card glass rounded-2xl p-6 text-left"><span class="text-2xl text-inertia">0${i+1}</span><p class="mt-10 text-lg font-bold">${g}</p><p class="mt-1 text-xs text-white/45">Explore collection →</p></button>`).join('')}</div></section>`) }
  function productsPage(){let cats=['All',...new Set(products.map(x=>x.game))];let shown=products.filter(x=>(catalogFilter==='All'||x.game===catalogFilter)&&x.name.toLowerCase().includes(catalogQuery.toLowerCase()));if(catalogSort==='low')shown.sort((a,b)=>a.price-b.price);if(catalogSort==='high')shown.sort((a,b)=>b.price-a.price);return shell(`<section class="page py-16"><div class="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/[.04] px-3 py-1 mb-4 text-[10px] uppercase tracking-[.3em] text-white/65 backdrop-blur-sm">Marketplace · 24/7 Instant delivery</div><h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl text-white">Explore products</h1><p class="mt-3 max-w-xl text-sm leading-6 text-white/55">Find the right product by game, price, or collection.</p><div class="glass mt-9 flex flex-col gap-3 rounded-2xl p-3 md:flex-row"><input oninput="catalogQuery=this.value;render()" value="${catalogQuery}" class="field flex-1" placeholder="Search products..." /><select onchange="catalogSort=this.value;render()" class="field w-auto text-sm"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="mt-5 flex flex-wrap gap-2">${cats.map(c=>`<button onclick="catalogFilter='${c}';render()" class="rounded-full border px-4 py-2 text-xs font-semibold transition ${catalogFilter===c?'border-cyan-300/50 bg-cyan-300/10 text-inertia':'border-white/10 bg-white/[.025] text-white/55 hover:border-white/30'}">${c}</button>`).join('')}</div><p class="mt-7 text-xs text-white/40">${shown.length} products found</p><div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${shown.map(productCard).join('')||'<p class="col-span-full py-16 text-center text-white/45">No products match your search.</p>'}</div></section>`) }
  function cartPage(){let lines=cart.map(id=>products.find(x=>x.id===id)).filter(Boolean);let subtotal=lines.reduce((s,x)=>s+x.price,0);return shell(`<section class="page mx-auto max-w-5xl py-16"><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Checkout</p><h1 class="mt-2 text-4xl font-black tracking-tight text-white">Your cart</h1><div class="mt-9 grid gap-5 lg:grid-cols-[1fr_340px]"><div class="space-y-3">${lines.length?lines.map((x,i)=>`<div class="glass flex items-center justify-between rounded-2xl p-5"><div><p class="text-xs font-semibold text-inertia">${x.game}</p><h3 class="mt-1 font-bold">${x.name}</h3><p class="mt-1 text-sm text-white/45">${money(x.price)}</p></div><button onclick="removeItem(${i})" class="rounded-lg px-3 py-2 text-xs text-white/50 transition hover:bg-white/10 hover:text-white">Remove</button></div>`).join(''):`<div class="glass rounded-2xl p-10 text-center text-white/45">Your cart is empty. <a data-nav href="/products" class="text-inertia">Browse the catalog.</a></div>`}</div><aside class="glass h-fit rounded-2xl p-6"><h2 class="font-bold">Order summary</h2><div class="mt-5 flex justify-between text-sm text-white/55"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="mt-3 flex justify-between border-b border-white/10 pb-5 text-sm text-white/55"><span>Delivery</span><span class="text-inertia">Instant</span></div><div class="mt-5 flex justify-between text-lg font-bold"><span>Total</span><span>${money(subtotal)}</span></div><div class="mt-5 flex gap-2"><input id="promo" class="field py-2 text-sm" placeholder="Promo code"/><button onclick="promo()" class="rounded-xl border border-white/15 px-3 text-xs font-bold hover:border-cyan-300/50">Apply</button></div><button onclick="checkout()" class="btn-primary mt-4 w-full rounded-xl py-3 text-sm font-bold">Secure checkout</button><p class="mt-4 text-center text-[10px] leading-4 text-white/35">Encrypted payment · Instant delivery · Support included</p></aside></div></section>`) }
  function login(){return shell(`<section class="page grid min-h-[68vh] place-items-center py-14"><div class="glass w-full max-w-md rounded-3xl p-7 sm:p-9"><a data-nav href="/" class="text-xl font-black">inertia<span class="text-inertia">.</span></a><h1 class="mt-9 text-3xl font-black tracking-tight">Welcome back</h1><p class="mt-2 text-sm text-white/50">Sign in or create an account to manage your orders.</p><div class="mt-7 space-y-3"><button onclick="loginGoogle()" class="w-full flex items-center justify-center gap-3 rounded-xl border border-white/15 bg-white/[.04] px-4 py-3 text-sm font-bold text-white hover:bg-white/[.08] hover:border-white/30 transition"><svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>Continue with Google</button><button onclick="loginDiscord()" class="w-full flex items-center justify-center gap-3 rounded-xl border border-[#5865F2]/30 bg-[#5865F2]/10 px-4 py-3 text-sm font-bold text-white hover:bg-[#5865F2]/20 hover:border-[#5865F2]/50 transition"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>Continue with Discord</button></div></div></section>`);}
  function loginGoogle(){let redirect=`http://localhost:${location.port}/api/auth/google/callback`;if(oauthConfig.googleClientId){window.location.href=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(oauthConfig.googleClientId)}&redirect_uri=${encodeURIComponent(redirect)}&response_type=code&scope=openid%20email%20profile&access_type=offline`}else{notice('Google OAuth not configured. Set GOOGLE_CLIENT_ID in .env')}}
  function loginDiscord(){let redirect=`http://localhost:${location.port}/api/auth/discord/callback`;if(oauthConfig.discordClientId){window.location.href=`https://discord.com/oauth2/authorize?client_id=${encodeURIComponent(oauthConfig.discordClientId)}&redirect_uri=${encodeURIComponent(redirect)}&response_type=code&scope=identify%20email`}else{notice('Discord OAuth not configured. Set DISCORD_CLIENT_ID in .env')}}
  function funpay(){return shell(`<section class="page mx-auto max-w-4xl py-20 text-center"><span class="rounded-full border border-cyan-300/20 bg-cyan-300/[.06] px-3 py-1 text-xs font-bold text-inertia">PARTNER PLATFORM</span><h1 class="mt-6 text-5xl font-black tracking-[-.05em] text-white">Funpay on Inertia.</h1><p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-white/55">A clear, low-friction destination for marketplace information, delivery expectations, and account support.</p><div class="mt-12 grid gap-4 text-left md:grid-cols-3">${[['01','Clear listings','Find the right listing without distraction.'],['02','Instant updates','Stay informed throughout your order.'],['03','Human support','Get help from a focused support channel.']].map(x=>`<div class="glow-card glass rounded-2xl p-6"><p class="text-inertia">${x[0]}</p><h2 class="mt-8 font-bold">${x[1]}</h2><p class="mt-2 text-xs leading-5 text-white/50">${x[2]}</p></div>`).join('')}</div><a data-nav href="/products" class="btn-primary mt-10 inline-block rounded-xl px-5 py-3 text-sm font-bold">Browse products</a></section>`) }
  function discord(){return shell(`<section class="page grid min-h-[67vh] place-items-center py-16"><div class="glass glow-card max-w-xl rounded-3xl p-8 text-center sm:p-12"><div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-[#5865f2] to-[#7289da] text-3xl font-black">⌁</div><p class="mt-7 text-xs font-bold uppercase tracking-[.18em] text-inertia">Community hub</p><h1 class="mt-3 text-4xl font-black tracking-tight">Join the Inertia community.</h1><p class="mt-4 text-sm leading-6 text-white/55">Get announcements, support updates, and connect with the wider Inertia community in one focused server.</p><button onclick="notice('Discord invite destination is ready to connect.')" class="btn-primary mt-7 rounded-xl px-5 py-3 text-sm font-bold">Open Discord</button><div class="mt-8 grid grid-cols-2 gap-4 border-t border-white/10 pt-7 text-left"><div><b>2,400+</b><span class="block text-xs text-white/40">Members</span></div><div><b>Always on</b><span class="block text-xs text-white/40">Support channels</span></div></div></div></section>`) }
  function support(){return shell(`<section class="page grid min-h-[67vh] place-items-center py-16"><div class="glass glow-card max-w-xl rounded-3xl p-8 text-center sm:p-12"><div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-[#5865f2] to-[#7289da] text-3xl font-black">⌁</div><p class="mt-7 text-xs font-bold uppercase tracking-[.18em] text-inertia">Need help?</p><h1 class="mt-3 text-4xl font-black tracking-tight">Inertia Support</h1><p class="mt-4 text-sm leading-6 text-white/55">Join our Discord server for order help, announcements, and general support inquiries — we're always here.</p><button onclick="notice('Discord invite destination is ready to connect.')" class="btn-primary mt-7 rounded-xl px-5 py-3 text-sm font-bold">Join Discord</button><div class="mt-8 grid grid-cols-2 gap-4 border-t border-white/10 pt-7 text-left"><div><b>2,400+</b><span class="block text-xs text-white/40">Members</span></div><div><b>24/7</b><span class="block text-xs text-white/40">Support available</span></div></div></div></section>`) }
  function dashboardPage(){return shell(`<section class="page mx-auto max-w-lg py-14"><div class="glass rounded-3xl p-7 sm:p-9"><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Owner & Developer access</p><h1 class="mt-3 text-3xl font-black">Inertia dashboard</h1><p class="mt-2 text-sm text-white/50">Use your admin password or secret key to access the dashboard.</p><div class="mt-6 space-y-4"><form onsubmit="adminLogin(event)" class="rounded-xl border border-white/10 p-4"><p class="text-xs font-bold text-white/60 mb-3">Admin password</p><input id="admin-password" class="field mb-3" type="password" required placeholder="Admin password"><button class="btn-primary w-full rounded-xl py-2.5 text-sm font-bold">Unlock with password</button></form><form onsubmit="ownerLogin(event)" class="rounded-xl border border-white/10 p-4"><p class="text-xs font-bold text-white/60 mb-3">Secret key (owner)</p><input id="owner-secret" class="field mb-3" type="password" required placeholder="Secret key"><button class="btn-glass w-full rounded-xl py-2.5 text-sm font-bold">Unlock with secret key</button></form></div></div></section>`) }
  function adminPanel(){if(!adminState&&!ownerState)return dashboardPage();let d=adminState||ownerState;let h=d.hero;return shell(`<section class="page py-12"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">${ownerState?'Owner':'Admin'} workspace</p><h1 class="mt-2 text-4xl font-black tracking-tight">Content control</h1></div><div class="flex gap-2"><button onclick="saveAdmin()" class="btn-primary rounded-xl px-4 py-2.5 text-sm font-bold">Save changes</button><button onclick="adminLogout()" class="rounded-xl border border-white/10 px-4 py-2.5 text-sm text-white/55 hover:text-white">Log out</button></div></div><div class="mt-8 grid gap-5 lg:grid-cols-[.9fr_1.1fr]"><section class="glass rounded-2xl p-6"><p class="text-xs font-bold uppercase tracking-wider text-inertia">Homepage visual</p><label class="mt-5 block text-xs font-semibold text-white/60">Headline<input id="hero-title" class="field mt-2" value="${esc(h.title)}"></label><label class="mt-4 block text-xs font-semibold text-white/60">Gradient highlight<input id="hero-highlight" class="field mt-2" value="${esc(h.highlight)}"></label><label class="mt-4 block text-xs font-semibold text-white/60">Supporting copy<textarea id="hero-description" class="field mt-2 min-h-24">${esc(h.description)}</textarea></label><label class="mt-4 block text-xs font-semibold text-white/60">Hero image URL<input id="hero-image" class="field mt-2" value="${esc(h.image)}" placeholder="https://..."></label><label class="mt-4 block cursor-pointer rounded-xl border border-dashed border-cyan-300/30 bg-cyan-300/[.04] p-4 text-center text-xs text-inertia hover:bg-cyan-300/[.08]">Upload hero image<input onchange="uploadHero(event)" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></label><p class="mt-3 text-[10px] leading-4 text-white/35">Uploads are stored in your server configuration. Keep imagery below 1.5 MB for a fast homepage.</p></section><section class="glass rounded-2xl p-6"><div class="flex items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-wider text-inertia">Catalog manager</p><p class="mt-1 text-xs text-white/45">Edit listing copy, stock, pricing, and media links.</p></div><button onclick="addProduct()" class="rounded-xl border border-cyan-300/30 px-3 py-2 text-xs font-bold text-inertia">Add product</button></div><div id="admin-products" class="mt-5 space-y-3">${d.products.map((p,i)=>`<div class="rounded-xl border border-white/10 bg-black/20 p-4"><div class="grid gap-3 sm:grid-cols-2"><input class="field text-sm" data-k="name" data-i="${i}" value="${esc(p.name)}" placeholder="Name"><input class="field text-sm" data-k="game" data-i="${i}" value="${esc(p.game)}" placeholder="Game"><input class="field text-sm" data-k="price" data-i="${i}" type="number" step=".01" value="${p.price}" placeholder="Price"><select class="field text-sm" data-k="stock" data-i="${i}"><option ${p.stock==='IN STOCK'?'selected':''}>IN STOCK</option><option ${p.stock==='OUT OF STOCK'?'selected':''}>OUT OF STOCK</option></select><input class="field text-sm sm:col-span-2" data-k="image" data-i="${i}" value="${esc(p.image||'')}" placeholder="Product image URL (optional)"><textarea class="field text-sm sm:col-span-2" data-k="description" data-i="${i}" placeholder="Description">${esc(p.description)}</textarea></div><div class="mt-3 flex justify-between"><label class="cursor-pointer text-xs text-inertia">Upload product art<input onchange="uploadProductImage(event,${i})" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></label><button onclick="deleteProduct(${i})" class="text-xs text-red-300">Remove</button></div></div>`).join('')}</div></section></div></section>`)}
  function render(){let route=location.pathname.replace(/\/$/,'')||'/';let view={'/':home,'/products':productsPage,'/cart':cartPage,'/login':login,'/funpay':funpay,'/discord':discord,'/support':support,'/dashboard/admin':adminPanel}[route]||home;document.getElementById('app').innerHTML=view();if(route==='/'){let title=document.querySelector('main h1');if(title)title.innerHTML=`${esc(site.hero.title)}<br><span class="bg-gradient-to-r from-cyan-400 via-cyan-200 to-inertia bg-clip-text text-transparent">${esc(site.hero.highlight)}</span>`;let copy=title&&title.nextElementSibling;if(copy)copy.textContent=site.hero.description}document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))})}
  function add(id){cart.push(id);save();render();enhance();notice('Added to cart')} function removeItem(i){cart.splice(i,1);save();render();enhance()} function filterGo(g){catalogFilter=g;go('/products')} function promo(){let p=document.getElementById('promo');notice(p.value?'Promo code recorded.':'Enter a promo code first.')} function checkout(){notice(cart.length?'Checkout handoff ready.':'Add an item before checkout.')} function notice(m){let x=document.createElement('div');x.className='fixed bottom-5 right-5 z-50 rounded-xl border border-emerald-300/30 bg-[#0b1310] px-4 py-3 text-sm shadow-2xl';x.textContent=m;document.body.append(x);setTimeout(()=>x.remove(),2400)}
  async function adminLogin(e){e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('admin-password').value})});if(!r.ok)return notice((await r.json()).error);adminState=await(await fetch('/api/admin/state')).json();render()}
  async function ownerLogin(e){e.preventDefault();let r=await fetch('/api/auth/owner-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:document.getElementById('owner-secret').value})});if(!r.ok)return notice((await r.json()).error);ownerState=await(await fetch('/api/admin/state')).json();render()}
  async function adminLogout(){await fetch('/api/auth/logout',{method:'POST'});await fetch('/api/auth/owner-logout',{method:'POST'});adminState=null;ownerState=null;render()}
  function getState(){return ownerState||adminState}
  function readAdminInputs(){let s=getState();if(!s)return;document.querySelectorAll('[data-k]').forEach(x=>s.products[Number(x.dataset.i)][x.dataset.k]=x.value);s.hero={title:document.getElementById('hero-title').value,highlight:document.getElementById('hero-highlight').value,description:document.getElementById('hero-description').value,image:document.getElementById('hero-image').value}}
  async function saveAdmin(){readAdminInputs();let s=getState();if(!s)return;let r=await fetch('/api/admin/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});let d=await r.json();if(!r.ok)return notice(d.error||'Unable to save');if(ownerState){ownerState=d}else{adminState=d}products=d.products;site=d;notice('Changes published')}
  function addProduct(){readAdminInputs();let s=getState();if(!s)return;s.products.push({id:Date.now(),name:'New product',game:'ROBLOX',price:0,currency:'USD',stock:'IN STOCK',rating:5,reviews:0,description:'Describe this product.',image:''});render()} function deleteProduct(i){readAdminInputs();let s=getState();if(!s)return;s.products.splice(i,1);render()} function imageToData(file,done){if(!file)return;if(file.size>1500000)return notice('Keep uploads below 1.5 MB');let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)} function uploadHero(e){imageToData(e.target.files[0],v=>{document.getElementById('hero-image').value=v;notice('Hero visual ready to save')})} function uploadProductImage(e,i){imageToData(e.target.files[0],v=>{readAdminInputs();let s=getState();if(s)s.products[i].image=v;render();notice('Product art ready to save')})}
  let revealObserver;
  function enhance(){
    if(revealObserver)revealObserver.disconnect();
    revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target)}}),{threshold:.12});
    document.querySelectorAll('main section').forEach((section,index)=>{section.classList.add('reveal');section.style.transitionDelay=`${Math.min(index*55,180)}ms`;revealObserver.observe(section)});
  }
  function snow(){const canvas=document.getElementById('snow-field'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let flakes=[];const resize=()=>{const scale=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*scale;canvas.height=innerHeight*scale;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(scale,0,0,scale,0,0);flakes=Array.from({length:Math.min(140,Math.max(50,Math.floor(innerWidth*innerHeight/16000)))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.3,v:Math.random()*.3+.1,w:Math.random()*.8-.4,a:Math.random()*.35+.12}))};const draw=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);flakes.forEach(f=>{f.y+=f.v;f.x+=f.w*.2;if(f.y>innerHeight+10){f.y=-10;f.x=Math.random()*innerWidth}ctx.beginPath();ctx.fillStyle=`rgba(210,230,255,${f.a})`;ctx.shadowColor=`rgba(200,225,255,${f.a*.4})`;ctx.shadowBlur=5;ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});if(!reduced)requestAnimationFrame(draw)};resize();addEventListener('resize',resize,{passive:true});draw()}
  async function hydrate(){try{let r=await fetch('/api/public');if(r.ok){let d=await r.json();products=d.products;site=d}let c=await fetch('/api/auth/oauth-config');if(c.ok){oauthConfig=await c.json()}}catch{}render();enhance()} snow(); hydrate();
  </script>
