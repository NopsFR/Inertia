<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inertia — Game Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui','sans-serif']},colors:{inertia:'#26e7a6'}}}}</script>
  <style>
    :root{color-scheme:dark} html{background:#030303} body{min-height:100vh;background:#030303;color:#f6f6f4;letter-spacing:.01em} button,input,select{font:inherit}
    .ambient{background:radial-gradient(ellipse 45% 30% at 50% 10%,rgba(255,255,255,.045),transparent 73%),radial-gradient(ellipse 28% 22% at 53% 60%,rgba(38,231,166,.045),transparent 78%),#030303}
    .mesh{opacity:.45;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 78%);animation:drift 30s linear infinite}
    .stars{position:fixed;inset:0;z-index:-9;pointer-events:none;background-image:radial-gradient(circle at 5% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 13% 43%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 19% 76%,#fff 0 1px,transparent 2px),radial-gradient(circle at 31% 25%,#fff 0 1.2px,transparent 2.2px),radial-gradient(circle at 41% 67%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 19%,#fff 0 1px,transparent 2px),radial-gradient(circle at 67% 48%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 79% 16%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 70%,#fff 0 1.3px,transparent 2.3px),radial-gradient(circle at 96% 35%,#fff 0 1px,transparent 2px);opacity:.55}
    .glass{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.42);backdrop-filter:blur(18px)}
    .glow-card{position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease,box-shadow .3s ease}.glow-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 65px rgba(0,0,0,.65),0 0 28px rgba(38,231,166,.08)}.glow-card:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;opacity:0;transition:opacity .3s;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.7),rgba(38,231,166,.5),transparent 76%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.glow-card:hover:before{opacity:1}
    .nav-link{color:rgba(255,255,255,.52);transition:.2s}.nav-link:hover,.nav-link.active{color:#fff}.nav-link.active{color:#00f0ff}
    .page{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes drift{to{background-position:50px 50px}}
    .btn-primary{background:linear-gradient(135deg,#f8f8f6,#d9d9d4);color:#080808;box-shadow:0 10px 30px rgba(255,255,255,.12);transition:.25s}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(255,255,255,.25);filter:brightness(1.08)}
    .field{width:100%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);border-radius:.75rem;padding:.8rem 1rem;outline:none;transition:.2s}.field:focus{border-color:rgba(38,231,166,.7);box-shadow:0 0 0 3px rgba(38,231,166,.1)}
    header{border:0!important;background:transparent!important;backdrop-filter:none!important;padding:1rem 1rem 0} header nav{height:48px!important;max-width:max-content!important;gap:1rem;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(8,8,8,.75);box-shadow:0 8px 35px rgba(0,0,0,.4);backdrop-filter:blur(16px)} header nav>a:first-child{margin-right:1rem}
    #particle-field{position:fixed;inset:0;z-index:-8;pointer-events:none;opacity:.72}.hero-stage{isolation:isolate;overflow:hidden}.hero-stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(430px circle at var(--pointer-x,50%) var(--pointer-y,50%),rgba(255,255,255,.10),transparent 45%);transition:background .15s linear}.hero-stage>*{position:relative;z-index:1}.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.75,.2,1),transform .7s cubic-bezier(.2,.75,.2,1)}.reveal.is-visible{opacity:1;transform:none}.metric-live{display:inline-block}.pulse-line{position:relative}.pulse-line:before{content:"";position:absolute;top:50%;right:calc(100% + 10px);width:5px;height:5px;border-radius:999px;background:#26e7a6;box-shadow:0 0 0 0 rgba(38,231,166,.5);animation:signal 2.2s infinite}@keyframes signal{70%{box-shadow:0 0 0 8px rgba(38,231,166,0)}100%{box-shadow:0 0 0 0 rgba(38,231,166,0)}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}#particle-field{display:none}}
  </style>
</head>
<body class="ambient font-sans antialiased">
  <canvas id="particle-field" aria-hidden="true"></canvas>
  <div class="stars"></div>
  <div class="mesh fixed inset-0 -z-10 pointer-events-none"></div>
  <div id="app"></div>
  <script>
  let products=[{id:1,name:'Roblox Executors',game:'ROBLOX',price:2.99,currency:'USD',stock:'IN STOCK',rating:5,reviews:214,description:'Premium Roblox executors — undetected, powerful, and easy to use. Pick your executor.',image:''},{id:2,name:'Roblox Scripts',game:'ROBLOX',price:4.99,currency:'USD',stock:'IN STOCK',rating:5,reviews:300,description:'Premium scripts for the most popular Roblox games. Pick your game to see which scripts support it.',image:''},{id:3,name:'Fallen Survival Account',game:'ROBLOX',price:1.99,currency:'USD',stock:'OUT OF STOCK',rating:5,reviews:156,description:'Roblox accounts with access to the game Fallen Survival. Unverified, aged, multiple variants available.',image:''},{id:4,name:'Matcha External',game:'ROBLOX',price:11.97,currency:'USD',stock:'IN STOCK',rating:5,reviews:58,description:'Premium Roblox external. Silent aim, full ESP, triggerbot and advanced visuals. Lifetime access.',image:''},{id:5,name:'Ignite Script',game:'ROBLOX',price:4.99,currency:'USD',stock:'IN STOCK',rating:4.9,reviews:321,description:'The ultimate undetected script for Fallen Survival and Havoc. Silent Aim • Wallbang • Hitscan • ESP and much more.',image:''},{id:6,name:'Serversiding',game:'ROBLOX',price:15,currency:'EUR',stock:'IN STOCK',rating:5,reviews:132,description:'The best web-based Roblox serverside executor. 600+ scripts straight from your browser, no download needed.',image:''},{id:7,name:'Xtools Roblox Multi Tool',game:'ROBLOX',price:19.99,currency:'USD',stock:'IN STOCK',rating:4.9,reviews:189,description:'30+ specialized tools to automate Roblox functions. No recurring fees.',image:''},{id:8,name:'Neverlose CS2',game:'CS2',price:31,currency:'EUR',stock:'IN STOCK',rating:5,reviews:48,description:'Premium CS2 internal cheat from Neverlose. Instant key delivery, redeem with your Neverlose username.',image:''}]; let site={hero:{title:'Move faster.',highlight:'Play smarter.',description:'A refined marketplace for the tools and access you need.',image:''}}; let adminState=null;
  let cart=JSON.parse(localStorage.getItem('inertia-cart')||'[]'); let catalogFilter='All'; let catalogQuery=''; let catalogSort='featured';
  const money=x=>(x.currency==='EUR'?'€':'$')+Number(x.price).toFixed(2); const save=()=>localStorage.setItem('inertia-cart',JSON.stringify(cart)); const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function go(path){history.pushState({},'',path);render();enhance();window.scrollTo({top:0,behavior:'smooth'})} window.onpopstate=()=>{render();enhance()};
  function nav(){let p=location.pathname;return `<header class="sticky top-0 z-30 border-b border-white/[.07] bg-[#050505]/75 backdrop-blur-xl"><nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5"><a href="/" data-nav class="text-lg font-black tracking-tight">inertia<span class="text-inertia">.</span></a><div class="hidden items-center gap-7 text-sm font-medium md:flex">${[['/','Home'],['/products','Products'],['/funpay','Funpay'],['/discord','Discord']].map(([u,n])=>`<a data-nav href="${u}" class="nav-link ${p===u?'active':''}">${n}</a>`).join('')}</div><div class="flex items-center gap-2"><a data-nav href="/login" class="hidden rounded-lg px-3 py-2 text-sm text-white/65 transition hover:text-white sm:block">Log in</a><a data-nav href="/cart" class="glass relative rounded-xl px-3 py-2 text-sm font-semibold transition hover:border-cyan-300/50">Cart <span class="ml-1 rounded-md bg-white/10 px-1.5 py-0.5 text-[10px] text-inertia">${cart.length}</span></a></div></nav></header>`}
  function footer(){return `<footer class="mt-24 border-t border-white/[.07] px-5 py-10 text-center text-xs text-white/35"><p class="font-bold tracking-wide text-white/60">inertia<span class="text-inertia">.</span></p><p class="mt-3">© 2026 Inertia. Built for a smoother marketplace experience.</p><div class="mt-4 flex justify-center gap-4 font-semibold"><a data-nav href="/discord" class="hover:text-inertia">Discord</a><a data-nav href="/funpay" class="hover:text-inertia">Platform</a><a data-nav href="/admin" class="hover:text-inertia">Dashboard</a></div></footer>`}
  function productCard(x){let art=x.image?`<img src="${esc(x.image)}" class="absolute inset-0 h-full w-full object-cover opacity-35" alt="">`:'';return `<article class="glow-card glass relative overflow-hidden rounded-2xl p-5"><div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-br from-blue-500/30 via-cyan-400/15 to-transparent">${art}</div><div class="relative"><div class="flex items-center justify-between"><span class="rounded-full border border-white/10 bg-black/20 px-2.5 py-1 text-[10px] font-bold text-white/75">${esc(x.game)}</span><span class="text-[10px] font-semibold ${x.stock==='OUT OF STOCK'?'text-red-300':'text-inertia'}">${esc(x.stock)}</span></div><div class="mt-12"><p class="text-[11px] font-semibold uppercase tracking-[.15em] text-white/40">★ ${esc(x.rating)} <span class="ml-1 text-white/35">(${esc(x.reviews)})</span></p><h3 class="mt-1 text-lg font-bold">${esc(x.name)}</h3><p class="mt-3 min-h-[40px] text-xs leading-5 text-white/55">${esc(x.description)}</p></div><div class="mt-5 flex items-end justify-between border-t border-white/10 pt-4"><div><span class="block text-[10px] font-medium uppercase tracking-wider text-white/35">Starting from</span><b class="text-xl">${money(x)}</b></div><button ${x.stock==='OUT OF STOCK'?'disabled':''} onclick="add(${x.id})" class="btn-primary rounded-xl px-3.5 py-2 text-xs font-bold text-white disabled:cursor-not-allowed disabled:opacity-35">${x.stock==='OUT OF STOCK'?'Unavailable':'Add to cart'}</button></div></div></article>`}
  function shell(content){return nav()+`<main class="mx-auto max-w-7xl px-5">${content}</main>`+footer()}
  function home(){return shell(`<section class="page grid min-h-[580px] items-center gap-10 py-20 lg:grid-cols-[1.12fr_.88fr]"><div><div class="mb-5 inline-flex items-center gap-2 rounded-full border border-cyan-300/15 bg-cyan-300/[.06] px-3 py-1.5 text-[11px] font-semibold text-inertia"><span class="h-1.5 w-1.5 animate-pulse rounded-full bg-inertia"></span> The competitive marketplace</div><h1 class="max-w-3xl text-5xl font-black tracking-[-.06em] text-white sm:text-7xl lg:text-8xl">Move faster.<br><span class="bg-gradient-to-r from-blue-400 via-cyan-200 to-inertia bg-clip-text text-transparent">Play smarter.</span></h1><p class="mt-6 max-w-xl text-base leading-7 text-white/55">Inertia is a refined marketplace for the tools and access you need—delivered through a focused, modern experience.</p><div class="mt-8 flex flex-wrap gap-3"><a data-nav href="/products" class="btn-primary rounded-xl px-5 py-3 text-sm font-bold">Explore products</a><a data-nav href="/discord" class="rounded-xl border border-white/12 bg-white/[.035] px-5 py-3 text-sm font-bold transition hover:border-cyan-300/50 hover:bg-white/[.07]">Join community</a></div><div class="mt-11 grid max-w-xl grid-cols-3 gap-6 border-t border-white/10 pt-6"><div><b class="text-2xl">5K+</b><span class="mt-1 block text-[10px] uppercase tracking-wider text-white/40">Orders</span></div><div><b class="text-2xl">4.9/5</b><span class="mt-1 block text-[10px] uppercase tracking-wider text-white/40">Rating</span></div><div><b class="text-2xl">24/7</b><span class="mt-1 block text-[10px] uppercase tracking-wider text-white/40">Support</span></div></div></div><div class="glass relative min-h-[390px] overflow-hidden rounded-3xl p-7"><div class="absolute -right-20 -top-20 h-72 w-72 rounded-full bg-cyan-400/20 blur-3xl"></div><div class="absolute bottom-0 left-0 h-3/5 w-full bg-[linear-gradient(145deg,transparent,rgba(59,130,246,.13))]"></div><div class="relative flex h-full flex-col justify-between"><div class="flex justify-between text-[10px] font-semibold uppercase tracking-[.18em] text-white/45"><span>Live marketplace</span><span class="text-inertia">Operational</span></div><div><div class="mb-5 flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-2xl border border-cyan-300/30 bg-cyan-300/10 text-xl text-inertia">↗</span><div><p class="font-bold">Inertia Console</p><p class="text-xs text-white/45">Everything, in motion.</p></div></div><div class="grid grid-cols-2 gap-3"><div class="rounded-2xl border border-white/10 bg-black/20 p-4"><p class="text-[10px] uppercase tracking-wider text-white/40">Current status</p><p class="mt-2 font-semibold text-inertia">Systems online</p></div><div class="rounded-2xl border border-white/10 bg-black/20 p-4"><p class="text-[10px] uppercase tracking-wider text-white/40">Delivery</p><p class="mt-2 font-semibold">Instant</p></div></div></div></div></div></section><section class="page py-16"><div class="mb-8 flex items-end justify-between"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Curated for you</p><h2 class="mt-2 text-3xl font-black tracking-tight">Featured products</h2></div><a data-nav href="/products" class="text-sm font-semibold text-inertia hover:text-white">View catalog →</a></div><div class="grid gap-4 md:grid-cols-3">${products.slice(0,3).map(productCard).join('')}</div></section><section class="page py-16"><p class="text-center text-xs font-bold uppercase tracking-[.18em] text-inertia">Browse by game</p><div class="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">${['Warzone','CS2','Roblox','Rust'].map((g,i)=>`<button onclick="filterGo('${g}')" class="glow-card glass rounded-2xl p-6 text-left"><span class="text-2xl text-inertia">0${i+1}</span><p class="mt-10 text-lg font-bold">${g}</p><p class="mt-1 text-xs text-white/45">Explore collection →</p></button>`).join('')}</div></section>`) }
  function productsPage(){let cats=['All',...new Set(products.map(x=>x.game))];let shown=products.filter(x=>(catalogFilter==='All'||x.game===catalogFilter)&&x.name.toLowerCase().includes(catalogQuery.toLowerCase()));if(catalogSort==='low')shown.sort((a,b)=>a.price-b.price);if(catalogSort==='high')shown.sort((a,b)=>b.price-a.price);return shell(`<section class="page py-16"><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Marketplace</p><h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl">Explore products</h1><p class="mt-3 max-w-xl text-sm leading-6 text-white/55">Find the right product by game, price, or collection.</p><div class="glass mt-9 flex flex-col gap-3 rounded-2xl p-3 md:flex-row"><input oninput="catalogQuery=this.value;render()" value="${catalogQuery}" class="field flex-1" placeholder="Search products..." /><select onchange="catalogSort=this.value;render()" class="field w-auto text-sm"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="mt-5 flex flex-wrap gap-2">${cats.map(c=>`<button onclick="catalogFilter='${c}';render()" class="rounded-full border px-4 py-2 text-xs font-semibold transition ${catalogFilter===c?'border-cyan-300/50 bg-cyan-300/10 text-inertia':'border-white/10 bg-white/[.025] text-white/55 hover:border-white/30'}">${c}</button>`).join('')}</div><p class="mt-7 text-xs text-white/40">${shown.length} products found</p><div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${shown.map(productCard).join('')||'<p class="py-16 text-white/45">No products match your search.</p>'}</div></section>`) }
  function cartPage(){let lines=cart.map(id=>products.find(x=>x.id===id)).filter(Boolean);let subtotal=lines.reduce((s,x)=>s+x.price,0);return shell(`<section class="page mx-auto max-w-5xl py-16"><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Checkout</p><h1 class="mt-2 text-4xl font-black tracking-tight">Your cart</h1><div class="mt-9 grid gap-5 lg:grid-cols-[1fr_340px]"><div class="space-y-3">${lines.length?lines.map((x,i)=>`<div class="glass flex items-center justify-between rounded-2xl p-5"><div><p class="text-xs font-semibold text-inertia">${x.game}</p><h3 class="mt-1 font-bold">${x.name}</h3><p class="mt-1 text-sm text-white/45">${money(x.price)}</p></div><button onclick="removeItem(${i})" class="rounded-lg px-3 py-2 text-xs text-white/50 transition hover:bg-white/10 hover:text-white">Remove</button></div>`).join(''):`<div class="glass rounded-2xl p-10 text-center text-white/45">Your cart is empty. <a data-nav href="/products" class="text-inertia">Browse the catalog.</a></div>`}</div><aside class="glass h-fit rounded-2xl p-6"><h2 class="font-bold">Order summary</h2><div class="mt-5 flex justify-between text-sm text-white/55"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="mt-3 flex justify-between border-b border-white/10 pb-5 text-sm text-white/55"><span>Delivery</span><span class="text-inertia">Instant</span></div><div class="mt-5 flex justify-between text-lg font-bold"><span>Total</span><span>${money(subtotal)}</span></div><div class="mt-5 flex gap-2"><input id="promo" class="field py-2 text-sm" placeholder="Promo code"/><button onclick="promo()" class="rounded-xl border border-white/15 px-3 text-xs font-bold hover:border-cyan-300/50">Apply</button></div><button onclick="checkout()" class="btn-primary mt-4 w-full rounded-xl py-3 text-sm font-bold">Secure checkout</button><p class="mt-4 text-center text-[10px] leading-4 text-white/35">Encrypted payment · Instant delivery · Support included</p></aside></div></section>`) }
  function login(){return shell(`<section class="page grid min-h-[68vh] place-items-center py-14"><form onsubmit="event.preventDefault();notice('Demo sign-in complete. Welcome to Inertia.');" class="glass w-full max-w-md rounded-3xl p-7 sm:p-9"><a data-nav href="/" class="text-xl font-black">inertia<span class="text-inertia">.</span></a><h1 class="mt-9 text-3xl font-black tracking-tight">Welcome back</h1><p class="mt-2 text-sm text-white/50">Sign in to manage your orders and account.</p><label class="mt-7 block text-xs font-semibold text-white/65">Email<input type="email" required class="field mt-2" placeholder="you@example.com"></label><label class="mt-4 block text-xs font-semibold text-white/65">Password<input type="password" required class="field mt-2" placeholder="••••••••"></label><button class="btn-primary mt-6 w-full rounded-xl py-3 text-sm font-bold">Sign in</button><p class="mt-5 text-center text-xs text-white/40">New here? <a href="#" class="text-inertia">Create an account</a></p></form></section>`) }
  function funpay(){return shell(`<section class="page mx-auto max-w-4xl py-20 text-center"><span class="rounded-full border border-cyan-300/20 bg-cyan-300/[.06] px-3 py-1 text-xs font-bold text-inertia">PARTNER PLATFORM</span><h1 class="mt-6 text-5xl font-black tracking-[-.05em]">Funpay on Inertia.</h1><p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-white/55">A clear, low-friction destination for marketplace information, delivery expectations, and account support.</p><div class="mt-12 grid gap-4 text-left md:grid-cols-3">${[['01','Clear listings','Find the right listing without distraction.'],['02','Instant updates','Stay informed throughout your order.'],['03','Human support','Get help from a focused support channel.']].map(x=>`<div class="glow-card glass rounded-2xl p-6"><p class="text-inertia">${x[0]}</p><h2 class="mt-8 font-bold">${x[1]}</h2><p class="mt-2 text-xs leading-5 text-white/50">${x[2]}</p></div>`).join('')}</div><a data-nav href="/products" class="btn-primary mt-10 inline-block rounded-xl px-5 py-3 text-sm font-bold">Browse products</a></section>`) }
  function discord(){return shell(`<section class="page grid min-h-[67vh] place-items-center py-16"><div class="glass glow-card max-w-xl rounded-3xl p-8 text-center sm:p-12"><div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-[#5865f2] to-[#7289da] text-3xl font-black">⌁</div><p class="mt-7 text-xs font-bold uppercase tracking-[.18em] text-inertia">Community hub</p><h1 class="mt-3 text-4xl font-black tracking-tight">Join the Inertia community.</h1><p class="mt-4 text-sm leading-6 text-white/55">Get announcements, support updates, and connect with the wider Inertia community in one focused server.</p><button onclick="notice('Discord invite destination is ready to connect.')" class="btn-primary mt-7 rounded-xl px-5 py-3 text-sm font-bold">Open Discord</button><div class="mt-8 grid grid-cols-2 gap-4 border-t border-white/10 pt-7 text-left"><div><b>2,400+</b><span class="block text-xs text-white/40">Members</span></div><div><b>Always on</b><span class="block text-xs text-white/40">Support channels</span></div></div></div></section>`) }
  function adminPage(){if(!adminState)return shell(`<section class="page mx-auto grid min-h-[68vh] max-w-md place-items-center py-14"><form onsubmit="adminLogin(event)" class="glass w-full rounded-3xl p-8"><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Owner & developer access</p><h1 class="mt-3 text-3xl font-black">Inertia admin</h1><p class="mt-2 text-sm text-white/50">Use the password configured on the server.</p><input id="admin-password" class="field mt-7" type="password" required placeholder="Admin password"><button class="btn-primary mt-4 w-full rounded-xl py-3 text-sm font-bold">Unlock dashboard</button></form></section>`);let h=adminState.hero;return shell(`<section class="page py-12"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-inertia">Owner & developer workspace</p><h1 class="mt-2 text-4xl font-black tracking-tight">Content control</h1></div><div class="flex gap-2"><button onclick="saveAdmin()" class="btn-primary rounded-xl px-4 py-2.5 text-sm font-bold">Save changes</button><button onclick="adminLogout()" class="rounded-xl border border-white/10 px-4 py-2.5 text-sm text-white/55 hover:text-white">Log out</button></div></div><div class="mt-8 grid gap-5 lg:grid-cols-[.9fr_1.1fr]"><section class="glass rounded-2xl p-6"><p class="text-xs font-bold uppercase tracking-wider text-inertia">Homepage visual</p><label class="mt-5 block text-xs font-semibold text-white/60">Headline<input id="hero-title" class="field mt-2" value="${esc(h.title)}"></label><label class="mt-4 block text-xs font-semibold text-white/60">Gradient highlight<input id="hero-highlight" class="field mt-2" value="${esc(h.highlight)}"></label><label class="mt-4 block text-xs font-semibold text-white/60">Supporting copy<textarea id="hero-description" class="field mt-2 min-h-24">${esc(h.description)}</textarea></label><label class="mt-4 block text-xs font-semibold text-white/60">Hero image URL<input id="hero-image" class="field mt-2" value="${esc(h.image)}" placeholder="https://..."></label><label class="mt-4 block cursor-pointer rounded-xl border border-dashed border-cyan-300/30 bg-cyan-300/[.04] p-4 text-center text-xs text-inertia hover:bg-cyan-300/[.08]">Upload hero image<input onchange="uploadHero(event)" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></label><p class="mt-3 text-[10px] leading-4 text-white/35">Uploads are stored in your server configuration. Keep imagery below 1.5 MB for a fast homepage.</p></section><section class="glass rounded-2xl p-6"><div class="flex items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-wider text-inertia">Catalog manager</p><p class="mt-1 text-xs text-white/45">Edit listing copy, stock, pricing, and media links.</p></div><button onclick="addProduct()" class="rounded-xl border border-cyan-300/30 px-3 py-2 text-xs font-bold text-inertia">Add product</button></div><div id="admin-products" class="mt-5 space-y-3">${adminState.products.map((p,i)=>`<div class="rounded-xl border border-white/10 bg-black/20 p-4"><div class="grid gap-3 sm:grid-cols-2"><input class="field text-sm" data-k="name" data-i="${i}" value="${esc(p.name)}" placeholder="Name"><input class="field text-sm" data-k="game" data-i="${i}" value="${esc(p.game)}" placeholder="Game"><input class="field text-sm" data-k="price" data-i="${i}" type="number" step=".01" value="${p.price}" placeholder="Price"><select class="field text-sm" data-k="stock" data-i="${i}"><option ${p.stock==='IN STOCK'?'selected':''}>IN STOCK</option><option ${p.stock==='OUT OF STOCK'?'selected':''}>OUT OF STOCK</option></select><input class="field text-sm sm:col-span-2" data-k="image" data-i="${i}" value="${esc(p.image||'')}" placeholder="Product image URL (optional)"><textarea class="field text-sm sm:col-span-2" data-k="description" data-i="${i}" placeholder="Description">${esc(p.description)}</textarea></div><div class="mt-3 flex justify-between"><label class="cursor-pointer text-xs text-inertia">Upload product art<input onchange="uploadProductImage(event,${i})" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></label><button onclick="deleteProduct(${i})" class="text-xs text-red-300">Remove</button></div></div>`).join('')}</div></section></div></section>`)}
  function render(){let route=location.pathname.replace(/\/$/,'')||'/';let view={'/':home,'/products':productsPage,'/cart':cartPage,'/login':login,'/funpay':funpay,'/discord':discord,'/admin':adminPage}[route]||home;document.getElementById('app').innerHTML=view();if(route==='/'){let title=document.querySelector('main h1');if(title)title.innerHTML=`${esc(site.hero.title)}<br><span class="bg-gradient-to-r from-blue-400 via-cyan-200 to-inertia bg-clip-text text-transparent">${esc(site.hero.highlight)}</span>`;let copy=title&&title.nextElementSibling;if(copy)copy.textContent=site.hero.description;let visual=document.querySelector('main .min-h-\\[390px\\]');if(visual&&site.hero.image)visual.style.backgroundImage=`linear-gradient(rgba(5,5,5,.22),rgba(5,5,5,.72)),url("${site.hero.image.replace(/"/g,'%22')}")`;visual&&visual.style.setProperty('background-size','cover')}document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))})}
  function add(id){cart.push(id);save();render();enhance();notice('Added to cart')} function removeItem(i){cart.splice(i,1);save();render();enhance()} function filterGo(g){catalogFilter=g;go('/products')} function promo(){let p=document.getElementById('promo');notice(p.value?'Promo code recorded.':'Enter a promo code first.')} function checkout(){notice(cart.length?'Checkout handoff ready.':'Add an item before checkout.')} function notice(m){let x=document.createElement('div');x.className='fixed bottom-5 right-5 z-50 rounded-xl border border-emerald-300/30 bg-[#0b1310] px-4 py-3 text-sm shadow-2xl';x.textContent=m;document.body.append(x);setTimeout(()=>x.remove(),2400)}
  async function adminLogin(e){e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('admin-password').value})});if(!r.ok)return notice((await r.json()).error);adminState=await (await fetch('/api/admin/state')).json();render()}
  async function adminLogout(){await fetch('/api/auth/logout',{method:'POST'});adminState=null;render()}
  function readAdminInputs(){document.querySelectorAll('[data-k]').forEach(x=>adminState.products[Number(x.dataset.i)][x.dataset.k]=x.value);adminState.hero={title:document.getElementById('hero-title').value,highlight:document.getElementById('hero-highlight').value,description:document.getElementById('hero-description').value,image:document.getElementById('hero-image').value}}
  async function saveAdmin(){readAdminInputs();let r=await fetch('/api/admin/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(adminState)});let d=await r.json();if(!r.ok)return notice(d.error||'Unable to save');adminState=d;products=d.products;site=d;notice('Changes published')}
  function addProduct(){readAdminInputs();adminState.products.push({id:Date.now(),name:'New product',game:'ROBLOX',price:0,currency:'USD',stock:'IN STOCK',rating:5,reviews:0,description:'Describe this product.',image:''});render()} function deleteProduct(i){readAdminInputs();adminState.products.splice(i,1);render()} function imageToData(file,done){if(!file)return;if(file.size>1500000)return notice('Keep uploads below 1.5 MB');let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)} function uploadHero(e){imageToData(e.target.files[0],v=>{document.getElementById('hero-image').value=v;notice('Hero visual ready to save')})} function uploadProductImage(e,i){imageToData(e.target.files[0],v=>{readAdminInputs();adminState.products[i].image=v;render();notice('Product art ready to save')})}
  let revealObserver;
  function enhance(){
    const stage=document.querySelector('main .glass');
    if(stage){stage.classList.add('hero-stage');stage.onpointermove=e=>{const r=stage.getBoundingClientRect();stage.style.setProperty('--pointer-x',`${e.clientX-r.left}px`);stage.style.setProperty('--pointer-y',`${e.clientY-r.top}px`)};stage.onpointerleave=()=>{stage.style.removeProperty('--pointer-x');stage.style.removeProperty('--pointer-y')}}
    if(revealObserver)revealObserver.disconnect();
    revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target)}}),{threshold:.12});
    document.querySelectorAll('main section').forEach((section,index)=>{section.classList.add('reveal');section.style.transitionDelay=`${Math.min(index*55,180)}ms`;revealObserver.observe(section)});
    document.querySelectorAll('main b').forEach(node=>{if(node.dataset.counted)return;const raw=node.textContent.trim();const m=raw.match(/^(\d+(?:\.\d+)?)([+\/]?\d*)$/);if(!m)return;node.dataset.counted='1';const target=Number(m[1]);const suffix=m[2]||'';const started=performance.now();const duration=700;const tick=now=>{let p=Math.min((now-started)/duration,1);let eased=1-Math.pow(1-p,3);node.textContent=(target%1?Math.round(target*eased*10)/10:Math.round(target*eased))+suffix;if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
  }
  function particles(){const canvas=document.getElementById('particle-field'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let dots=[];const resize=()=>{const scale=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*scale;canvas.height=innerHeight*scale;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(scale,0,0,scale,0,0);const count=Math.min(110,Math.max(38,Math.floor(innerWidth*innerHeight/19000)));dots=Array.from({length:count},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.25+.25,v:Math.random()*.16+.025,a:Math.random()*.65+.15}))};const draw=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);dots.forEach(d=>{d.y-=d.v;if(d.y<-3){d.y=innerHeight+3;d.x=Math.random()*innerWidth}ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${d.a})`;ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()});if(!reduced)requestAnimationFrame(draw)};resize();addEventListener('resize',resize,{passive:true});draw()}
  async function hydrate(){try{let r=await fetch('/api/public');if(r.ok){let d=await r.json();products=d.products;site=d}}catch{}render();enhance()} particles(); hydrate();
  </script>
